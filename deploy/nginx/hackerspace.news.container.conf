server {
    server_name www.hackerspace.news;
    return 301 https://hackerspace.news$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hackerspace.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerspace.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name hackerspace.news;

    access_log /var/log/nginx/hackerspace.news.access.log spaced;
    error_log  /var/log/nginx/hackerspace.news.error.log;

    include /etc/nginx/snippets/block-probes.conf;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/(wp-admin|wordpress/wp-admin|wp-login\.php|xmlrpc\.php) {
        access_log off;
        return 404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hackerspace.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackerspace.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.hackerspace.news) {
        return 301 https://hackerspace.news$request_uri;
    }

    if ($host = hackerspace.news) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name hackerspace.news www.hackerspace.news;
    return 404;
}
