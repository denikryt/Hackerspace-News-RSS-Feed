server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* ^/(wp-admin|wordpress/wp-admin|wp-login\.php|xmlrpc\.php) {
        access_log off;
        return 404;
    }
}
