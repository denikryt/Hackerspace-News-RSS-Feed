services:
  site-builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    mem_limit: ${BUILDER_MEMORY_MIB:-1024}m
    memswap_limit: ${BUILDER_MEMORY_MIB:-1024}m
    init: true
    environment:
      BUILDER_MEMORY_MIB: ${BUILDER_MEMORY_MIB:-1024}
      NODE_OLD_SPACE_MIB: ${NODE_OLD_SPACE_MIB:-768}
      NODE_OPTIONS: --max-old-space-size=${NODE_OLD_SPACE_MIB:-768}
      SITE_BUILD_MODE: build
      SITE_BUILD_ARGS: ""
    volumes:
      # Keep refresh snapshots across one-shot builder containers and image rebuilds.
      - site-data:/app/data
      - site-html:/published-site
    command:
      - /bin/sh
      - -ceu
      - |
        # Build or render first; the previous published volume remains intact
        # if acquisition, parsing, or rendering fails.
        case "$${SITE_BUILD_MODE:-build}" in
          build)
            if [ -n "$${SITE_BUILD_ARGS:-}" ]; then
              npm run build -- $${SITE_BUILD_ARGS}
            else
              npm run build
            fi
            ;;
          render)
            npm run render
            ;;
          *)
            echo "Unknown SITE_BUILD_MODE: $${SITE_BUILD_MODE}" >&2
            exit 1
            ;;
        esac

        # Publish through a staging directory inside the shared volume so stale
        # files are removed only after a complete dist tree exists.
        staging=/published-site/.next
        rm -rf "$$staging"
        mkdir -p "$$staging"
        cp -a dist/. "$$staging"/
        find /published-site -mindepth 1 -maxdepth 1 ! -name .next -exec rm -rf {} +
        cp -a "$$staging"/. /published-site/
        rm -rf "$$staging"

  site:
    build:
      context: .
      dockerfile: Dockerfile
      target: site
    ports:
      - "127.0.0.1:18088:80"
    volumes:
      - site-html:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    restart: unless-stopped

volumes:
  site-data:
  site-html:
